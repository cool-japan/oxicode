# Machine-readable mirror of the "Measured L1 verdict" doc comment on every
# `#[harness]` entry point in this package, in exactly the format
# `cargo-formal`'s own `examples/checked-arith/EXPECTED.toml` and
# `examples/ecosystem/oxicode-varint/EXPECTED.toml` use.
#
# **MEASURED, not predicted** (2026-09-14, release `cargo-formal` 0.1.0 CLI +
# release `formal-driver` with dependency-body lowering (D1) and on-demand
# monomorphic instance lowering (D2), OxiZ 0.3.3, rustc nightly-2026-06-20).
# The harnesses call the **real, public** API of the `oxicode` crate by path
# (`encode_to_fixed_array`, `decode_from_slice`, and their `_with_config`
# variants); `[package.metadata.formal] dep-crates` names `oxicode`, and the
# run lowered 42 dependency bodies (6 reachable) plus 68 monomorphic instances
# (68 reachable) into the verification conditions -- 224 of them, 0 cached,
# 6 s wall, exit 0. No verdict below was written before the run that produced
# it.
#
# Naming. A property key is the word the **encoder actually mints**, never a
# description:
#
#   * a user-written `oxiformal::assert(..)` is `assert`; a second distinct
#     assertion raised at the *same* source site is `assert-2`, a third
#     `assert-3`, and so on.
#   * an `#[ensures]` clause checked through `#[proof_for_contract]` is
#     `ensures`, and is reported under layer `contract`. This package has none.
#   * everything else is the design section 9 closed vocabulary MIR's own
#     inserted checks produce: `arith-overflow`, `shift-overflow`,
#     `bounds-check`, `division-by-zero`, `remainder-by-zero`,
#     `division-overflow`, `neg-overflow`, `unwrap`, `expect`, `panic`,
#     `slice-range`, `unwinding-assertion`. The suffixed forms the encoder
#     mints for distinct checks at one site (`arith-overflow-2`,
#     `slice-range-3`, ...) occur in this run and are separate keys.
#   * the pseudo-key `harness` is a **whole-harness** verdict and nothing else:
#     `"proved"` means "no obligation of this harness is anything but proved"
#     (including a harness that raises none at all), and `"unsupported"` covers
#     both `Verdict::Unsupported` and `Verdict::Unverifiable`. It is used here
#     for exactly one harness -- the one that states no assertion of its own.
#
# What is listed. Every obligation the harness is *about* -- its `assert`s,
# plus its `unwinding-assertion` where it has one (this run raised **no**
# `unwinding-assertion` obligation anywhere, so no harness has such a row; the
# absence is not evidence that any `unwind` bound was or was not enough) --
# and every incidental MIR-inserted check whose verdict is **not** `proved`
# (there are none: all 6 non-proved obligations in this run are `assert`s).
# Incidental checks that came out `proved` are deliberately not enumerated:
# they are numerous (`arith-overflow`, `bounds-check`, `slice-range`,
# `shift-overflow`, `neg-overflow` inside `oxicode`'s own lowered bodies),
# they carry no information, and listing them would make this file a copy of
# `report.json` rather than a statement of intent.
#
# Keying rule. `[harness.expected]` is a map, so several obligations of one
# harness that carry the same property name at *different* source sites share
# one row. The row records the **worst** of their verdicts (`refuted` >
# `timeout` > `unknown` > `unsupported`/`unverifiable` > `proved`), and a row
# comment says how many sites there are and how they came out, in the form
# "N sites: a proved, b unknown (site file:line, solver-model-rejected on
# OxiZ 0.3.3)". Six rows in this file use that rule non-trivially; the rest
# are uniform across their sites.
#
# Measured tally (2026-09-14): 9 property rows over 9 harnesses -- 3 proved /
# 0 refuted / **6 unknown** / 0 timeout / 0 unsupported. The run's own layer
# counters, which include the incidental `proved` rows this file does not
# enumerate, are: `hygiene` pass (2 files scanned, 0 errors, 0 warnings,
# 0 notes, 0 unsafe sites); `bmc` 218 proved / 0 refuted / 6 unknown /
# 0 timeout / 0 unsupported / 0 unverifiable over 224 obligations, every one of
# the 224 backed by a `reproduction` evidence record; `contract` 0 proved /
# 0 refuted (this package has no `#[requires]`/`#[ensures]`); `theorem` not
# run. `coverage`: 0 of 0 public functions annotated, 9 harnesses.
#
# `solver-model-rejected` count: **6** -- every non-proved obligation in the
# run, and nothing else. cargo-formal is pinned to OxiZ 0.3.3, whose model gate
# (upstream item U-Z10) turns a solver model that does not satisfy the
# verification condition into `unknown` rather than an invented
# counterexample; the driver's mandatory model check refused all six. U-Z10 is
# fixed in the `../oxiz` working tree (unreleased); the pin stays at `=0.3.3`
# until that release ships, and these six rows are *expected* to move to
# `proved` when it does -- no 0.3.4 run has been measured, so that is an
# expectation and not a measurement.
#
# Re-measured 2026-09-15 with the Phase 3 release CLI (options: autoharness
# off, modular on, vacuity check on; release cargo-formal 0621fc0, 0
# uncommitted files, OxiZ 0.3.3, rustc nightly-2026-06-20, --jobs 4, fresh
# --target-dir, two runs): every row reproduces identically -- bmc 218
# proved / 0 refuted / 6 unknown, contract 0 proved / 0 refuted, 224
# obligations, hygiene PASS, exit 0, 5 s both times. run1<->run2 is
# byte-identical (0 verdict/id/message changes). Against the 2026-09-14
# report (`compare_expected.py --prev`): 0 added/removed ids, 0 FLIPs, 0
# message-only changes -- measured directly (`bounded-sequence` appears in 0
# of 224 messages in both this run and the 2026-09-14 one), so this package
# is the one D4 package with a byte-identical report end to end, unlike
# oxiarc-formal's 504 `bounded-sequence` message additions. The six
# `solver-model-rejected` rows above are unchanged in identity and count.
# `coverage.claim` now appears (`claim unmet 218 of 218 proved`, requires
# lrat/oxilean-verify/external-replay) where the 2026-09-14 report had none --
# confirmed from `crates/formal-config/src/resolved.rs`'s
# `defaults::claim_requires()` to be an unconditional CLI default applied to
# every package that does not set `claim-requires` in its manifest,
# regardless of `self_host` -- a new Phase 3 default report surface, not a
# verdict row (see the D4 report for detail).
#
# History, not current state. Before Phase 2b's `P2-14` landed, every harness
# in this package was a whole-harness `unsupported(no-body)` and this file
# recorded nine such rows. The cause was specific: `oxicode` reaches its varint
# codec only through `encoder.writer()`/`decoder.reader()`, and the driver did
# not normalize the associated-type projection in those accessors' *monomorphic
# instance* signatures -- `<EncoderImpl<SliceWriter<'_>, Configuration> as
# Encoder>::W` (symmetrically `::R`) survived un-normalized, so every instance
# was refused before its body was ever requested, and no verification condition
# from this package reached OxiZ at all. `P2-14` normalizes an instance
# signature with the **fallible** normalizer under
# `TypingEnv::fully_monomorphized()` (see `cargo-formal`'s `CHANGELOG.md`,
# `P2-14` bullet), which is exactly what those two accessors needed. All nine
# harnesses now encode, and the remaining six `unknown`s are a solver-pin
# matter, not a driver matter.
#
# The vendored twin (`cargo-formal`'s `examples/ecosystem/oxicode-varint`,
# which vendored five `pub(crate)` files of `oxicode/src/varint/` because the
# driver could not lower a path dependency's bodies at all before Phase 2b)
# measured 176 proved / 1 refuted / 2 unknown. Its harnesses bypass real
# dispatch with hand-rolled `Writer`/`Reader` generics; this package goes
# through `oxicode`'s real `Encoder`/`Decoder`/`EncoderImpl`/`DecoderImpl`
# dispatch (68 instances lowered). Both now encode. The twin's
# `varint_u64_bound_is_tight_harness` is `refuted` while this package's
# same-named harness is `proved` because they state different propositions:
# the twin asserts an 8-byte writer holds a `u64` (false, counterexample
# `u64::MAX`); this package asserts the biconditional
# `result.is_err() == (value > u32::MAX as u64)` (true). The twin's two
# `unknown`s sit on the same inner-decode `Err(_) => assert(false)` arm as
# five of this package's six -- in the twin at its `src/harness.rs:200:19`
# and `:220:19`, here at `:151:23`, `:173:23`, `:195:23`, `:270:23` and
# `:290:23`; its `decoded == value` equalities (`:199:24`, `:219:24`) are
# proved too. Same root cause (U-Z10) and the same shape of site. The only
# site this package has that the twin does not is the wide-tag check
# (`:315:5`).

